# Bug report form. The required fields are the ones a report cannot be acted on
# without: the architecture (the two Homebrew prefixes and the two CI legs
# differ), the exact commands, and what happened against what was expected.
name: Bug report
description: Something the framework does is wrong, or it stopped working.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report a security vulnerability here. Use the private advisory
        form linked from the issue chooser, or see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you ran, what it printed, and what you expected instead. Paste the
        output rather than describing it.
      placeholder: |
        $ ./install.sh
        ...
        Expected: ...
        Got: ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Shortest way to reproduce it
      description: >-
        Numbered commands starting from a clone. If you cannot reproduce it on
        a fresh clone, say what is different about the machine where it happens.
      placeholder: |
        1. git clone --recurse-submodules https://github.com/brunovenceslau/dotfiles.git ~/.config/dotfiles
        2. cd ~/.config/dotfiles && ./install.sh
        3. exec zsh
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      description: >-
        The Homebrew prefix, the Brewfile blocks and the CI legs all differ by
        architecture, so this decides where the bug can even happen.
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
        - Not macOS (unsupported, see the README)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: The output of `sw_vers -productVersion`.
      placeholder: "15.3"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git -C ~/.config/dotfiles rev-parse HEAD`.
      placeholder: 0000000000000000000000000000000000000000
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: Gate output
      description: >-
        The tail of `make local-ci STRICT=1`, if you were able to run it. Say so
        if you were not, and say which suites skipped if any did.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: >-
            I checked docs/troubleshooting.md, which lists the framework's own
            messages with a cause and a fix for each one.
          required: true
        - label: >-
            This is not a security vulnerability. Those go through the private
            advisory form.
          required: true
