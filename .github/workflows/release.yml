# Release - turn a signed tag into a GitHub release.
#
# The whole release procedure is two commands on a maintainer's machine:
#
#   git tag -s vX.Y.Z <merge commit>
#   git push origin vX.Y.Z
#
# Everything after that push happens here. There is no manual step on the
# success path, and nothing to click: see docs/development.md, "Cutting a
# release".
#
# Notes are generated by git-cliff from the conventional-commit subjects in the
# range since the previous tag (the whole history for the first tag). The
# template is cliff.toml.
#
# git-cliff arrives as a PINNED, CHECKSUM-VERIFIED release binary in a `run:`
# step, never as a third-party action: the repository's Actions policy allows
# GitHub-owned actions only, so a `uses:` line here would have to widen it.
# A pinned tarball plus its sha256 is the same supply-chain promise the plugin
# submodules make - the bytes cannot change under us.
#
# There is no tracked CHANGELOG.md. The release page is the only place the
# generated notes live, so the tree can never hold a stale second copy.

name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default; the release job widens its own scope below.
permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY elevated permission in this repository, scoped to this job:
    # `gh release create` publishes the release. Nothing else is granted.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history AND tags: the notes span from the previous tag, which
          # a shallow clone cannot see - it would silently produce a release
          # with every commit in it, or none.
          fetch-depth: 0
          # Nothing here pushes; don't leave GITHUB_TOKEN in the checkout's
          # git config. `gh` authenticates through GH_TOKEN instead.
          persist-credentials: false

      - name: Install git-cliff (pinned, sha256-verified)
        env:
          # Bump both together. The digest is of the asset itself and was
          # cross-checked against the .sha512 sidecar published with it.
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: fa21e2fc70046fcfd0e43e5e4613873ab799aff3d9dc8559c00d31b270e417d0
        run: |
          set -euo pipefail
          # musl, so the binary does not depend on the runner image's glibc.
          asset="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${asset}"
          cd "$RUNNER_TEMP"
          # --fail: a 404 or a 5xx must abort here, not hand an HTML error page
          # to sha256sum and fail with a confusing digest mismatch.
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
               --location --retry 3 --output "$asset" "$url"
          echo "${GIT_CLIFF_SHA256}  ${asset}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$asset" --strip-components=1 \
              -C "$RUNNER_TEMP/bin" "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          chmod u+x "$RUNNER_TEMP/bin/git-cliff"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generate the release notes
        env:
          # Never interpolate `${{ }}` into a shell script: the value reaches
          # the script as an environment variable, so it cannot be parsed as
          # shell.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The previous VERSION tag reachable from this one. Absent for the
          # first release, and then the range is the whole history: `--latest`
          # is the newest tag's section, which at that point is this tag.
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
          # --config, not git-cliff's config discovery: the template that
          # shapes a published release is the one tracked in this repository,
          # never a stray user-level cliff.toml on the runner.
          if [ -n "$prev" ]; then
            echo "notes: ${prev}..${TAG}"
            git-cliff --config cliff.toml --tag "$TAG" "${prev}..${TAG}" \
                      --output "$RUNNER_TEMP/notes.md"
          else
            echo "notes: first release, whole history up to ${TAG}"
            git-cliff --config cliff.toml --tag "$TAG" --latest \
                      --output "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --verify-tag: refuse to invent a tag. The release can only ever
          # describe the signed tag that triggered this run.
          # --title: gh/GitHub's default (the bare tag, e.g. "v0.2.0") reads as
          # version noise on GitHub's global releases feed; "dotfiles $TAG"
          # names the project inline so the title alone identifies what
          # shipped.
          gh release create "$TAG" --verify-tag --title "dotfiles $TAG" --notes-file "$RUNNER_TEMP/notes.md"
