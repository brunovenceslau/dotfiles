# CI - the verification gate.
#
# Runs the single locally-runnable gate - `make local-ci STRICT=1` (lint +
# test-env-scrub + test + reuse + gitleaks + secret-scan + smoke + forkgate +
# linkcheck + commit-identity + check-patterns-gawk) - on a GITHUB-HOSTED macOS
# runner. macOS is the only platform the framework installs on, so there is no
# leg for any other OS. There is deliberately NO QEMU/container emulation: each
# leg is real hardware of its own architecture, which is what the Brewfile
# on_arm/on_intel blocks, the Homebrew-prefix detection and the bash 3.2 +
# BSD-tools assumptions actually exercise.
#
# Legs: a push or pull request runs the arm64 leg (`macos-latest`, Apple
# Silicon), the required check. Intel support is best effort since 2026-10-17:
# its leg is slow and GitHub is retiring its images, so it runs on a schedule,
# not on pull requests. .github/workflows/intel.yml calls this workflow with
# the Intel leg in `legs`; the steps below are the one definition of both.
#
# The gate is a `make` target (`make local-ci`), never inline YAML
#   logic; setup steps only install the tools that target needs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The scheduled Intel leg (.github/workflows/intel.yml) calls this workflow.
  workflow_call:
    inputs:
      legs:
        description: JSON list of {name, runs-on} legs to run instead of arm64.
        type: string
        required: true

# Least privilege: the workflow only reads the repo to verify it.
permissions:
  contents: read

# Cancel superseded runs on rapid re-pushes/PR updates (each ref keeps its group).
# The event is in the group so a scheduled Intel run on main and a push run on
# main never cancel each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  local-ci:
    name: local-ci (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A push or pull request has no inputs, so it runs the default: the
        # arm64 leg alone. tests/ci_workflow_test.sh and
        # tests/repo_settings_test.sh read this default literal.
        include: ${{ fromJSON(inputs.legs || '[{"name":"macos-arm64","runs-on":"macos-latest"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a PR, test the PR head - the commit under review, not a synthetic
          # merge. On a push to main, github.sha is already the integrated tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # smoke installs into a scratch HOME and loads the plugin submodules -
          # check them out so it is the real path, not a degraded no-plugin one.
          submodules: recursive
          # no authenticated git after clone; don't leave GITHUB_TOKEN on the runner.
          persist-credentials: false

      # Setup, not a gate: make local-ci invokes shellcheck, zsh, reuse,
      # gitleaks and gawk. The hosted image already ships make, zsh, python3
      # and jq; install ONLY what this particular image is missing - a blanket
      # `brew install` would re-link the image's preinstalled python3 and fail
      # the step. `reuse` and `gitleaks` are homebrew-core formulae; the reuse
      # one installs the reuse[charset-normalizer] extra the tool needs to
      # detect file encodings. `gawk` (homebrew-core formula `gawk`,
      # https://formulae.brew.sh/formula/gawk) is the character-counting awk
      # that `make check-patterns-gawk` runs bin/check-patterns under: macOS's
      # own awk counts bytes. It is a CI and contributor tool, not a
      # dependency of the framework. This loop is the single list of what CI
      # provisions: tests/dev_docs_prereqs_test.sh holds docs/development.md's
      # Prerequisites section to it, so a tool added here without a docs entry
      # fails the gate rather than stranding a contributor.
      - name: Ensure gate tools (macOS)
        if: runner.os == 'macOS'
        run: |
          missing=''
          for tool in make shellcheck zsh tmux fzf jq xz reuse gitleaks gawk; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            # shellcheck disable=SC2086 # word splitting is the point: a formula list
            brew install $missing
          fi
          # python3 ships with the image and is NOT brew-installed here (see above);
          # if it is ever absent the gate must fail closed rather than fight brew.
          command -v python3 >/dev/null 2>&1 \
            || { echo "python3 missing from the runner image" >&2; exit 1; }
          # openssh (ssh-keygen) is part of the macOS base. PyYAML is a Python module,
          # not a brew formula: install it into the image's python3 if not already
          # importable. PINNED and HASH-LOCKED: .github/ci-requirements.txt lists
          # the sha256 of every file pip may pick, and --require-hashes refuses
          # anything else.
          python3 -I -c 'import yaml' >/dev/null 2>&1 \
            || python3 -m pip install --quiet --break-system-packages \
                 --require-hashes -r .github/ci-requirements.txt

      # Record, not a gate: the gate tools are an input to the gates, and the brew
      # step above installs whatever homebrew-core ships that day. Printing each
      # version into the job log makes a gate regression traceable to a tool bump.
      - name: Gate tool versions
        run: |
          shellcheck --version | sed -n 2p
          zsh --version
          tmux -V
          jq --version
          xz --version | sed -n 1p
          reuse --version | sed -n 1p
          gawk --version | sed -n 1p
          gitleaks version
          python3 -I -c 'import yaml, sys; print("python", sys.version.split()[0], "pyyaml", yaml.__version__)'
          # Two interpreters, printed, never compared: bin/ runs under the first
          # bash on PATH, install.sh and the smoke's installer under /bin/bash.
          printf 'PATH bash: '; bash --version | sed -n 1p
          printf '/bin/bash: '; /bin/bash --version | sed -n 1p

      # STRICT=1: a skipped check (e.g. a missing tool) is a hard failure, so CI
      # can never report green on a gate it did not actually run. local-ci =
      # lint + test-env-scrub + test + reuse + gitleaks + secret-scan + smoke +
      # forkgate + linkcheck + commit-identity + check-patterns-gawk; `make
      # test` runs this workflow's contract test.
      - name: make local-ci
        run: make local-ci STRICT=1
