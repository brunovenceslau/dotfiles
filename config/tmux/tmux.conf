# config/tmux/tmux.conf - linked to ~/.config/tmux/tmux.conf (tmux >= 3.1 reads
# this XDG path natively). A portable base; per-host overrides go in
# the untracked tmux.local.conf - copy it from tmux.local.conf.example. That file
# is sourced LAST (bottom) so it wins; `-q` keeps a missing .local
# silent. tmux has no file-relative source-file, so the reload and .local paths
# below hardcode ~/.config/tmux/ - this assumes XDG_CONFIG_HOME = ~/.config (the
# framework's convention). tmux owns splits/tabs/sessions and the terminal
# emulator is only the window: alacritty.toml binds no key at all, and Ghostty's
# cmd+d / cmd+shift+d send the tmux prefix plus `|` / `-` (bound below) rather
# than splitting themselves.

# Colors: 256-color terminfo + truecolor (RGB) passthrough for the terminals this
# framework targets - Alacritty ($TERM=alacritty) and Ghostty ($TERM=xterm-ghostty).
# `Tc` and `RGB` are equivalent truecolor capabilities; Ghostty needs its own entry
# because xterm-ghostty matches neither *256col* nor alacritty.
# NOTE: `tmux-256color` needs that terminfo entry; present on macOS via Homebrew
# ncurses / the Ghostty install (fall back to `screen-256color` in tmux.local.conf
# if tmux ever reports "missing terminal"). Ghostty over ssh to a remote box:
# install its terminfo there (`infocmp -x xterm-ghostty | ssh HOST -- tic -x -`)
# or set `shell-integration-features = ssh-terminfo` in the Ghostty config.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-ghostty:RGB"
# Curly/colored underlines (e.g. LSP diagnostics in vim) - passthrough for
# terminals that support them (Alacritty, Ghostty).
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# Prefix: C-a (screen-style, easier reach). Keep C-b as the SECONDARY prefix so
# muscle memory from the default still works; `C-a C-a` sends a literal C-a.
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1         # panes start at 1
set -g renumber-windows on        # keep window numbers gapless
set -g history-limit 50000
set -sg escape-time 10            # don't swallow ESC (snappier in vim)
set -g focus-events on
set -g set-clipboard on           # OSC 52: yank -> system clipboard (Alacritty/Ghostty, incl. over ssh)

# Splits that keep the current directory, and intuitive keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

setw -g mode-keys vi              # vi-style copy mode

# Reload the config in place.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Status line. Cost-safe: tmux-native `#{...}` for
# session/window/host/time (no fork), plus ONE cheap `bin/tmux-status` per interval
# for the git branch + a load bar. The `#(...)` GUARDS the helper
# with `test -x` and degrades to the native
# segments wherever the helper is absent. Everything here is plain `set` so the .local
# layer below can restyle or
# disable it (`set -g status off`, or a new status-right).
#
# SECURITY: do NOT pass the pane path (or any `#{...}` format value)
# as an argument here. tmux interpolates formats by RAW TEXT into the `#(...)`
# /bin/sh command, and its `#{q:...}` shell-quote modifier does NOT escape newline or
# tab (measured on tmux 3.6) - so a directory name can inject a command that runs on
# every `status-interval`, on every host. The helper instead fetches the pane
# path from tmux over the socket (as data), keeping every byte out of the shell.
# Also do NOT hide the helper path behind a shell variable: tmux expands `$VAR` at
# config-parse time, so a `$H`-style var is clobbered to empty before /bin/sh sees it
# and the helper silently never runs. The path is inlined via `$HOME`, which tmux
# expands per-machine to an absolute path (the target homes have no spaces).
set -g status on
set -g status-interval 5
set -g status-left " #S "
set -g status-left-length 24
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-right "#(test -x $HOME/.config/dotfiles/bin/tmux-status && $HOME/.config/dotfiles/bin/tmux-status) #h  %H:%M "
set -g status-right-length 90

# Per-host overrides, sourced LAST so they win. `-q`: silent when
# the file is absent - the common case - instead of a startup error.
source-file -q ~/.config/tmux/tmux.local.conf
