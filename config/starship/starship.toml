"$schema" = 'https://starship.rs/config-schema.json'

# Two lines, budgeted for an 80-column window - the narrowest split in use.
#
# Line 1 is split by $fill: identity + location + git are anchored LEFT, and
# everything that is merely ambient (runtime, container, cloud, timing) is
# pushed RIGHT. $fill, not `right_format`: zsh renders starship's right prompt
# as RPROMPT, which sits on the LAST line of the prompt - beside the ❯, not
# beside the directory. $fill is part of the same line, so it lands where the
# eye expects it.
#
# NO module prints $version. That is a latency contract, not a taste call:
# starship only shells out to the toolchain when $version is in the format, so
# a bare $symbol keeps `java -version` (hundreds of ms) off every prompt.
#
# Colors are named ANSI, never hex. config/ghostty/config swaps the whole
# palette on the system theme (light:gruvbox-ipe-light, dark:ipe-amarelo), and
# those themes are where the 4.5:1 contrast is calibrated - a hex literal here
# would pin the prompt to one of the two and go unreadable in the other.
#
# `bold` is a brightness decision, not emphasis: that same Ghostty config sets
# bold-color = bright, so a bold span pulls palette 9-14 rather than 1-6. On
# ipe-amarelo those brights run 6.7:1 to 12.7:1 against the background and
# glare at a normal screen brightness. So bold is spent only where the prompt
# has to interrupt - the character, a failed exit code, an unfinished rebase, a
# dying battery. Steady context (location, branch, toolchain, cluster) stays on
# the normal palette, which still clears 4.5:1 in BOTH themes.
format = """
$hostname\
$localip\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$git_metrics\
$c$rust$golang$nodejs$php$java$kotlin$haskell$python\
$docker_context\
$conda\
$kubernetes\
$gcloud\
$shlvl\
$jobs\
$battery\
$cmd_duration\
$line_break\
$status$character"""

# The right-hand block is glued to the right edge, so every module there pads on
# its LEFT: a trailing space would sit past the last glyph and cost a column the
# fill has already spent.

[fill]
symbol = " "

# --- Left: identity -----------------------------------------------------------

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = "green"

[localip]
disabled = false
ssh_only = true
format = '[$localipv4]($style) '
style = "green"

# --- Left: location -----------------------------------------------------------

[directory]
style = "blue"
read_only_style = "red"
read_only = " "
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

# --- Left: git ----------------------------------------------------------------

[git_branch]
symbol = ""
format = '[$symbol $branch]($style) '
style = "purple"

# Was configured but never rendered: $git_state was missing from the format, so
# a half-finished rebase looked exactly like a clean checkout.
[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold yellow"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "red"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

# --- Right: repo churn --------------------------------------------------------

[git_metrics]
disabled = false
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'
added_style = "green"
deleted_style = "red"

# --- Right: toolchains (symbol only - see the $version note at the top) --------

[c]
symbol = ""
format = ' [$symbol]($style)'
style = "blue"

[rust]
symbol = ""
format = ' [$symbol]($style)'
style = "red"

[golang]
symbol = ""
format = ' [$symbol]($style)'
style = "cyan"

[nodejs]
symbol = ""
format = ' [$symbol]($style)'
style = "green"

[php]
symbol = ""
format = ' [$symbol]($style)'
style = "purple"

[java]
symbol = ""
format = ' [$symbol]($style)'
style = "red"

[kotlin]
symbol = ""
format = ' [$symbol]($style)'
style = "purple"

[haskell]
symbol = ""
format = ' [$symbol]($style)'
style = "purple"

[python]
symbol = ""
format = ' [$symbol]($style)'
style = "yellow"

# --- Right: ambient context ---------------------------------------------------

[docker_context]
symbol = ""
format = ' [$symbol $context]($style)'
style = "blue"

[conda]
format = ' [$symbol$environment]($style)'
style = "green"

# The kubectl context is GLOBAL, so an unrestricted kubernetes module prints
# itself in every prompt on the machine - 19 columns of cluster name while you
# edit a README. detect_* narrows it to where a wrong context can actually hurt.
# Note the asymmetry: detect_folders matches a folder INSIDE the current
# directory (a repo root holding k8s/), while detect_files is what catches you
# once you have cd'd down into the chart itself.
[kubernetes]
disabled = false
symbol = "kc:"
format = ' [$symbol$context( kn:$namespace)]($style)'
style = "cyan"
detect_files = ["kustomization.yaml", "Chart.yaml", "skaffold.yaml", "values.yaml"]
detect_folders = ["k8s", "kubernetes", "helm", "charts", "manifests"]

[[kubernetes.contexts]]
context_pattern = "docker-desktop"
user_pattern = "docker-desktop"
context_alias = ""

[gcloud]
disabled = false
symbol = "gcp:"
format = ' [$symbol$active]($style)'
style = "blue"

# Real GCP project ids carry a numeric suffix nobody reads (acme-prod-418923).
# Alias them down to the word you actually think in - same information, a third
# of the columns. One block per project; `project` matches the id verbatim.
# [[gcloud.project_aliases]]
# project = "acme-prod-418923"
# alias = "prod"

# --- Right: session state -----------------------------------------------------

# threshold 3, not the default 2: tmux already spends one level, so 2 is the
# normal state here and would pin this to the prompt forever.
[shlvl]
disabled = false
threshold = 3
symbol = "shlvl:"
format = ' [$symbol$shlvl]($style)'
style = "yellow"

[jobs]
symbol = "✦"
format = ' [$symbol$number]($style)'
style = "purple"

[battery]
format = ' [$symbol$percentage]($style)'

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "yellow"

[cmd_duration]
min_time = 300 # ms
show_milliseconds = true
format = ' [$duration]($style)'
style = "yellow"

# --- Line 2: the prompt itself ------------------------------------------------

[line_break]
disabled = false

[status]
disabled = false
symbol = "✘"
format = '[$symbol$status]($style) '
style = "bold red"

[character]
disabled = false
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
vimcmd_symbol = '[](bold green)'
vimcmd_replace_one_symbol = '[](bold purple)'
vimcmd_replace_symbol = '[](bold purple)'
vimcmd_visual_symbol = '[](bold yellow)'
