# config/gnupg/gpg-agent.conf - linked (with gpg.conf only) into ~/.gnupg by the
# link engine's gnupg exception; the rest of ~/.gnupg is the agent's own state and
# is never touched.
#
# gpg-agent.conf has no include directive and no variable expansion, so the
# pinentry path MUST be absolute and cannot be prefix-detected the way the shell
# does it. /opt/homebrew is the Apple Silicon prefix; on the Intel mac pinentry-mac
# lives at /usr/local/bin/pinentry-mac, so that host overrides this file by hand
# (~/.gnupg/gpg-agent.conf is a link, so edit the repo copy there or drop the link).
pinentry-program /opt/homebrew/bin/pinentry-mac
