# config/gnupg/gpg.conf - linked (with gpg-agent.conf only) into ~/.gnupg by the
# link engine's gnupg exception; the rest of ~/.gnupg is the agent's own state and
# is never touched.
#
# GPG hardening, strict: every preference below names ONE algorithm, so a peer
# that cannot do it makes gpg abort rather than silently negotiate something
# weaker. That is the whole point - the cost is an occasional hard failure against
# an old implementation, which is the failure you want to see.

# --- Symmetric cipher and hashing --------------------------------------------

# Preference list with AES256 ALONE. If the recipient's public key advertises no
# AES256 support, gpg aborts instead of falling back to a weaker cipher.
personal-cipher-preferences AES256

# The cipher used when there is no preference negotiation at all - e.g. pure
# symmetric encryption with a passphrase and no recipient.
cipher-algo AES256

# Hash preference, SHA512 alone: no SHA1, no SHA256.
personal-digest-preferences SHA512

# The default digest algorithm.
digest-algo SHA512

# The hash used when signing keys (certifications). This is the one that has to
# hold up over the key's whole lifetime, so it gets the same treatment.
cert-digest-algo SHA512

# Compression. ZLIB is the balanced safe default; a stricter posture would use
# Uncompressed to remove the compression-ratio side channel entirely.
personal-compress-preferences ZLIB
compress-algo ZLIB


# --- Private-key protection at rest (S2K, string-to-key) ---------------------
# How the private key is protected on disk by its passphrase.

# Encrypt the private key locally with AES256.
s2k-cipher-algo AES256

# Derive the encryption key from the passphrase with SHA512.
s2k-digest-algo SHA512

# Mode 3, "iterated and salted": salt plus iterations, so rainbow tables do not
# apply.
s2k-mode 3

# ~65 million iterations. Each guess costs the CPU a fraction of a second, which
# is what makes a large offline brute force impractical.
s2k-count 65011712


# --- Privacy (metadata) ------------------------------------------------------

# The most important privacy option here: keep the recipient's key ID out of the
# encrypted message header, so an interceptor learns that this is a PGP message
# but not WHO it is for. The cost is real - the recipient must try every private
# key they hold to open it.
throw-keyids

# Do not emit the gpg version in the output.
no-emit-version

# Do not emit comments ("Created by GPG...") in the output.
no-comments


# --- Output format -----------------------------------------------------------

# ASCII-armored (.asc) output instead of binary (.gpg) would make copy/paste and
# visual audit easier, at ~135% of the binary size. Left off deliberately; turn it
# on per-invocation with --armor when you actually want text.
# armor

# Show key IDs in the long (64-bit) form. Short 32-bit IDs are cheap to collide.
keyid-format 0xlong

# Show the fingerprint in listings, so a rigorous visual check is possible.
with-fingerprint

# Use gpg-agent for private-key operations (the modern default).
use-agent


# --- Integrity ---------------------------------------------------------------

# Refuse keys without a valid cross-certification, which blocks the class of
# attack where a signing subkey is forged onto someone else's primary key.
require-cross-certification

# Force MDC (modification detection code) so a ciphertext cannot be modified
# undetected. Recent gpg treats this as mandatory and ignores the flag; kept
# because an older gpg on some host would not.
force-mdc
