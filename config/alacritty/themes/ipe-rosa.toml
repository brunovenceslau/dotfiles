# config/alacritty/themes/ipe-rosa.toml - "Ipê Rosa": the pink-ipê variant of
# the ipê theme family. Colour only - no font, opacity, or
# behaviour keys - so it composes cleanly under alacritty.toml's import chain.
# Signature: vivid-pink cursor/accent (#ec6a9c) on a plum-charcoal base.
# Activate it by pointing the base import at this file (see alacritty.toml). The
# palette is maintainer-fixed; not a secret; host-only (alacritty is macOS GUI).

[colors.primary]
background = "#1a1014"
foreground = "#eed9df"
[colors.cursor]
text = "#1a1014"
cursor = "#ec6a9c"
[colors.selection]
background = "#452430"
text = "#f9ebef"
[colors.normal]
black = "#2e2229"
red = "#e56674"
green = "#8caf77"
yellow = "#dba85c"
blue = "#6f9ad0"
magenta = "#ec6a9c"
cyan = "#5cb0a6"
white = "#e6d5da"
[colors.bright]
black = "#43333b"
red = "#fb8290"
green = "#a8cd92"
yellow = "#f4c277"
blue = "#8fb8ee"
magenta = "#ff8bb6"
cyan = "#79cfc3"
white = "#f9ebef"
